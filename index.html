<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QLTZ Notifier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0d1117; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .rainbow-box { 
            padding: 4px; 
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000); 
            background-size: 400%; 
            border-radius: 15px; 
            animation: move 5s linear infinite; 
            max-width: 400px; 
            width: 100%;
        }
        .content { 
            background: #161b22; 
            padding: 20px 15px; 
            border-radius: 12px; 
            text-align: center; 
            color: white; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { 
            font-size: 24px; 
            color: #f0f6fc; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
            font-weight: 900; 
            letter-spacing: 1px;
        }
        .id-display { 
            background: #000; 
            padding: 10px; 
            border-radius: 5px; 
            font-family: monospace; 
            color: #00ff96; 
            margin-bottom: 15px; 
            border: 1px solid #30363d; 
            word-break: break-all; 
            font-size: 12px; 
            cursor: pointer; 
            user-select: all;
        }
        .id-display:active { background: #111; }
        .discord-link { 
            display: block; 
            margin-bottom: 15px; 
            color: #5865f2; 
            text-decoration: none; 
            font-weight: bold; 
            border: 2px solid #5865f2; 
            padding: 10px; 
            border-radius: 8px; 
            transition: 0.3s; 
            font-size: 14px;
        }
        .discord-link:active { background: #5865f2; color: white; }
        .btn { 
            display: block; 
            background: #238636; 
            color: white; 
            padding: 18px; 
            border-radius: 8px; 
            font-weight: 900; 
            font-size: 22px; 
            cursor: pointer; 
            border: none; 
            width: 100%; 
            transition: 0.2s; 
            box-shadow: 0 0 20px rgba(35, 134, 54, 0.5);
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        @keyframes move { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        /* Small screens */
        @media (max-width: 480px) {
            h1 { font-size: 20px; }
            .content { padding: 15px 12px; }
            .id-display { font-size: 10px; padding: 8px; }
            .btn { font-size: 18px; padding: 15px; }
            .discord-link { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="rainbow-box">
        <div class="content">
            <h1>QLTZ Notifier</h1>
            <div class="id-display" id="jobDisplay" title="Tap to copy ID">LOADING ID...</div>
            <a href="https://discord.gg/yjPXWGbNXS" class="discord-link">Join Discord</a>
            <button id="joinBtn" class="btn">Join</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let id = params.get('jobid') || params.get('jobId');
        let placeId = params.get('placeid') || params.get('placeId');

        if (id && placeId) {
            id = id.trim().replace(/['"]+/g, '').replace(/[^a-zA-Z0-9\-]/g, ""); 
            placeId = placeId.trim().replace(/[^0-9]/g, "");
            
            document.getElementById('jobDisplay').innerText = id;

            document.getElementById('jobDisplay').onclick = () => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(id).then(() => {
                        alert("ID Copied!");
                    }).catch(() => {
                        // Fallback
                        const el = document.createElement('textarea');
                        el.value = id;
                        document.body.appendChild(el);
                        el.select();
                        document.execCommand('copy');
                        document.body.removeChild(el);
                        alert("ID Copied!");
                    });
                } else {
                    // Fallback for older devices
                    const el = document.createElement('textarea');
                    el.value = id;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    alert("ID Copied!");
                }
            };

            const launch = () => {
                const methods = [
                    "roblox://experiences/start?placeId=" + placeId + "&gameInstanceId=" + id,
                    "roblox-player:1+launchmode:play+gameinstanceid:" + id + "+placeid:" + placeId,
                    "roblox://placeId=" + placeId + "&gameInstanceId=" + id
                ];

                methods.forEach((uri, index) => {
                    setTimeout(() => {
                        let frame = document.createElement('iframe');
                        frame.style.display = 'none';
                        frame.src = uri;
                        document.body.appendChild(frame);
                    }, index * 50);
                });

                methods.forEach((uri, index) => {
                    setTimeout(() => { window.location.assign(uri); }, 200 + (index * 50));
                });
            };

            setTimeout(launch, 300);
            document.getElementById('joinBtn').onclick = launch;
        } else {
            document.getElementById('jobDisplay').innerText = "MISSING ID";
        }
    </script>
</body>
</html>
